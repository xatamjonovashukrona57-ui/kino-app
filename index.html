<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault Cinema</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Tabiat manzarali orqa fon */
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.9)),
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            padding: 15px;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        /* Yuqori panel */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.4);
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Shaffof Qidiruv Maydoni */
        .search-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
        }

        .search-input::placeholder { color: #cbd5e1; }

        /* Shaffof Shisha Karta (Glassmorphism) */
        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .movie-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .movie-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .movie-title {
            font-size: 17px;
            font-weight: 700;
            color: #f8fafc;
        }

        .movie-code {
            background: rgba(56, 189, 248, 0.25);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .movie-genre {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .action-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px;
            transition: 0.2s;
        }

        .btn-play {
            background: #22c55e;
            color: white;
            grid-column: span 2;
            font-size: 14px;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        button:active { transform: scale(0.96); }

        /* Modal oynalar (Profil va Sozlamalar) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        /* Pastki Menyu */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active { color: #38bdf8; font-weight: bold; }
        .nav-item span { font-size: 20px; }
    </style>
</head>
<body>

    <!-- Yuqori panel -->
    <div class="top-bar">
        <div class="brand-title">🎬 CineVault</div>
        <button class="settings-btn" onclick="openModal('settingsModal')">⚙️ Sozlamalar</button>
    </div>

    <!-- Qidiruv -->
    <input type="text" id="searchInput" class="search-input" 
           placeholder="🔍 Kino nomi yoki kodini kiriting..." 
           oninput="searchMovies()">

    <!-- Kinolar Ro'yxati -->
    <div class="movie-list" id="movieList"></div>

    <!-- Pastki Navigatsiya -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchNav(this)">
            <span>🎬</span> Asosiy
        </div>
        <div class="nav-item" onclick="openModal('profileModal')">
            <span>👤</span> Profil
        </div>
    </div>

    <!-- Sozlamalar Modali -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px;">⚙️ Sozlamalar</h3>
            <button class="btn-play" style="background:#0284c7; margin-bottom:10px;" onclick="reloadApp()">🔄 Qayta ishga tushirish</button>
            <button class="btn-glass" style="width:100%;" onclick="closeModal('settingsModal')">Yopish</button>
        </div>
    </div>

    <!-- Profil Modali -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div style="font-size:45px; margin-bottom:10px;">👤</div>
            <h3 id="profName">Foydalanuvchi</h3>
            <p id="profId" style="font-size:12px; color:#cbd5e1; margin: 8px 0 15px 0;">ID: -</p>
            <p style="font-size:13px; color:#38bdf8; margin-bottom:15px;">⭐ CineVault Premium Foydalanuvchisi</p>
            <button class="btn-glass" style="width:100%;" onclick="closeModal('profileModal')">Yopish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // KINOLAR BAZASI (Shu yerga yangi kinolarni qo'shishingiz mumkin)
        const moviesData = [
            { code: "101", title: "Qasoskorlar: Intihosiz urush", genre: "Jangari, Fantastika" },
            { code: "102", title: "Interstellar (Yulduzlararo)", genre: "Ilmiy-Fantastika" },
            { code: "103", title: "O'rgimchak Odam: Uyga yo'l yo'q", genre: "Jangari, Sarguzasht" }
        ];

        function renderMovies(list) {
            const container = document.getElementById('movieList');
            if (!list || list.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#cbd5e1; padding:20px;">❌ Hech qanday kino topilmadi</p>';
                return;
            }

            container.innerHTML = list.map(movie => `
                <div class="movie-card">
                    <div class="movie-header">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-code">KOD: ${movie.code}</div>
                    </div>
                    <div class="movie-genre">🎭 Janr: ${movie.genre}</div>
                    <div class="action-btns">
                        <button class="btn-play" onclick="playMovie('${movie.code}')">▶️ Ko'rish (Botda)</button>
                        <button class="btn-glass" onclick="copyText('${movie.code}')">📋 Kodni nusxalash</button>
                        <button class="btn-glass" onclick="shareMovie('${movie.title}', '${movie.code}')">🚀 Ulashish</button>
                    </div>
                </div>
            `).join('');
        }

        renderMovies(moviesData);

        function searchMovies() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = moviesData.filter(m => 
                m.title.toLowerCase().includes(q) || 
                m.code.toString().includes(q)
            );
            renderMovies(filtered);
        }

        function playMovie(code) { tg.sendData(code); }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            tg.showAlert("📋 Kod nusxalandi: " + text);
        }

        function shareMovie(title, code) {
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent('🍿 ' + title + ' kinosi kodi: ' + code)}`;
            tg.openTelegramLink(shareUrl);
        }

        function openModal(id) {
            if(id === 'profileModal') {
                const user = tg.initDataUnsafe?.user;
                document.getElementById('profName').innerText = user ? (user.first_name + ' ' + (user.last_name || '')) : "Telegram Foydalanuvchisi";
                document.getElementById('profId').innerText = "ID: " + (user?.id || "Noma'lum");
            }
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function reloadApp() {
            closeModal('settingsModal');
            location.reload();
        }
    </script>
</body>
</html>
